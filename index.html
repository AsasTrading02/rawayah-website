<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rawayah — Opening Soon</title>
<meta name="description" content="Rawayah, a UAE automotive, procurement and general trading company, is opening soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%233B6E91'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Georgia, serif' font-weight='700' fill='%23FFFFFF' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF;
    --paper:#F3F6F9;
    --steel:#3B6E91;
    --steel-deep:#274F6B;
    --ink:#1E2B36;
    --mist:#5C7385;
    --line:#DCE3E8;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(900px circle at 50% 0%, var(--paper) 0%, var(--white) 60%);
  }
  a{ color:inherit; }
  a:focus-visible{ outline:2px solid var(--steel); outline-offset:3px; }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 24px;
  }
  .logo{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:1.4rem;
    letter-spacing:0.02em;
    color:var(--ink);
  }
  .subtitle{
    margin-top:8px;
    font-size:0.95rem;
    color:var(--mist);
  }
  h1{
    margin:34px 0 0;
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    font-size:clamp(2.8rem, 6vw + 1rem, 5.2rem);
    line-height:0.98;
    letter-spacing:-0.01em;
    color:var(--steel-deep);
  }
  main p{
    margin:20px 0 0;
    max-width:44ch;
    color:var(--mist);
    font-size:1.05rem;
  }

  .progress{
    position:relative;
    width:240px;
    height:4px;
    background:var(--line);
    border-radius:2px;
    overflow:hidden;
    margin:36px auto 0;
  }
  .progress .bar{
    position:absolute;
    top:0; left:-40%;
    height:100%;
    width:40%;
    background:var(--steel);
    border-radius:2px;
    animation:indeterminate 1.7s ease-in-out infinite;
  }
  @keyframes indeterminate{
    0%{ left:-40%; }
    100%{ left:100%; }
  }

  .btn{
    display:inline-block;
    margin-top:32px;
    padding:15px 26px;
    background:var(--steel);
    color:var(--white);
    font-weight:600;
    font-size:0.95rem;
    text-decoration:none;
    border-radius:3px;
    transition:background .15s;
  }
  .btn:hover{ background:var(--steel-deep); }

  footer{
    padding:22px 24px;
    text-align:center;
    font-size:0.82rem;
    color:var(--mist);
  }

  @media (prefers-reduced-motion: reduce){
    .progress .bar{ animation:none; left:30%; }
  }
</style>
</head>
<body>

<main>
  <span class="logo">RAWAYAH</span>
  <span class="subtitle">Automotive, procurement &amp; general trading</span>

  <h1>Opening soon.</h1>
  <p>We're putting the finishing touches on our automotive, procurement and general trading business. Get in touch and we'll keep you posted.</p>

  <div class="progress"><div class="bar"></div></div>

  <a href="mailto:info@rawayah.ae?subject=Keep%20me%20posted" class="btn">Get in touch</a>
</main>

<footer>© 2026 Rawayah, United Arab Emirates</footer>

</body>
</html>
